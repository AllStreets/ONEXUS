  </g>

  <text x="645" y="208" text-anchor="middle" font-size="76" font-weight="700" letter-spacing="10" fill="url(#word)">ONEXUS</text>
  <text x="640" y="252" text-anchor="middle" font-size="22" fill="#b6bcc6">An operating system for agents</text>
  <text x="640" y="284" text-anchor="middle" font-size="15" fill="#9ba2ad">Local-first. Every call an agent makes through it is checked by Aegis.</text>
