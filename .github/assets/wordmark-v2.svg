  <rect x="0.5" y="0.5" width="1279" height="339" rx="15.5" fill="none" stroke="#4ed5d5" stroke-opacity="0.14"/>

  <g transform="translate(608 58) scale(2.667)">
    <circle cx="12" cy="12" r="8.25" fill="none" stroke="#4ed5d5" stroke-width="1.75" opacity="0.9"/>
    <circle cx="12" cy="12" r="3" fill="#4ed5d5"/>
