    </radialGradient>
    <radialGradient id="f2" cx="0.95" cy="1" r="0.8">
      <stop offset="0" stop-color="#0c2a49" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0c2a49" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eceef2"/>
      <stop offset="0.35" stop-color="#eceef2"/>
