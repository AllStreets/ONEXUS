<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 376" role="img" aria-labelledby="t d">
  <title id="t">Trust tiers and the thresholds Aegis acts on</title>
  <desc id="d">A trust scale from 0 to 1 split into four tiers: observer below 0.25, advisor from 0.25, monitor from 0.50, executor from 0.75, and autonomous at 1.0. Cortex skips modules under 0.25 when it routes on its own, modules start at 0.30, grants collapse below 0.50, and notable calls are allowed without a prompt from 0.75.</desc>
  <defs>
    <radialGradient id="field" cx="0.12" cy="0" r="0.9">
      <stop offset="0" stop-color="#0d2d30" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0d2d30" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif; }
    .num { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; }
    .h1 { font-size: 22px; font-weight: 600; fill: #eceef2; letter-spacing: -0.2px; }
    .sub { font-size: 14px; fill: #9ba2ad; }
    .tier { font-size: 14px; font-weight: 600; fill: #eceef2; }
    .tick { font-size: 12px; fill: #9ba2ad; }
    .h3 { font-size: 15px; font-weight: 600; fill: #eceef2; }
    .body { font-size: 13px; fill: #b6bcc6; }
  </style>

  <rect width="1200" height="376" rx="16" fill="#0b0c0f"/>
  <rect width="1200" height="376" rx="16" fill="url(#field)"/>
  <rect x="0.5" y="0.5" width="1199" height="375" rx="15.5" fill="none" stroke="#4ed5d5" stroke-opacity="0.14"/>

  <text x="56" y="62" class="h1">Trust decides how much an agent may do</text>
  <text x="56" y="88" class="sub">Every module and agent carries a score from 0 to 1. It moves on recorded outcomes, and Aegis reads it on every call.</text>

  <text x="210" y="140" class="tier" text-anchor="middle">Observer</text>
  <text x="470" y="140" class="tier" text-anchor="middle">Advisor</text>
  <text x="730" y="140" class="tier" text-anchor="middle">Monitor</text>
  <text x="955" y="140" class="tier" text-anchor="middle">Executor</text>
  <text x="1120" y="140" class="tier" text-anchor="end" style="fill:#7fe0d6">Autonomous</text>

  <rect x="80"  y="158" width="258" height="10" rx="5" fill="#f17070" fill-opacity="0.55"/>
  <rect x="342" y="158" width="256" height="10" rx="5" fill="#f5b75b" fill-opacity="0.55"/>
  <rect x="602" y="158" width="256" height="10" rx="5" fill="#8fb0f8" fill-opacity="0.6"/>
  <rect x="862" y="158" width="250" height="10" rx="5" fill="#76cf8a" fill-opacity="0.7"/>
  <circle cx="1120" cy="163" r="6" fill="#4ed5d5"/>

  <g stroke="#eceef2" stroke-opacity="0.5" stroke-width="1">
    <line x1="340" y1="150" x2="340" y2="182"/>
    <line x1="600" y1="150" x2="600" y2="182"/>
    <line x1="860" y1="150" x2="860" y2="182"/>
  </g>
  <path d="M392 176 l-5 8 h10 z" fill="#eceef2" fill-opacity="0.75"/>

  <g class="num tick">
    <text x="80" y="204">0</text>
    <text x="340" y="204" text-anchor="middle">0.25</text>
    <text x="398" y="204" text-anchor="start">0.30</text>
    <text x="600" y="204" text-anchor="middle">0.50</text>
    <text x="860" y="204" text-anchor="middle">0.75</text>
    <text x="1120" y="204" text-anchor="end">1.0</text>
  </g>

  <line x1="56" y1="238" x2="1144" y2="238" stroke="#ffffff" stroke-opacity="0.08"/>

  <g transform="translate(56 274)">
    <text class="num" x="0" y="0" font-size="13" fill="#f5b75b">0.25</text>
    <text class="h3" x="44" y="0">Routing floor</text>
    <text class="body" x="0" y="26">Cortex skips a module below this</text>
    <text class="body" x="0" y="45">when it picks a route on its own.</text>
  </g>
  <g transform="translate(330 274)">
    <text class="num" x="0" y="0" font-size="13" fill="#eceef2">0.30</text>
    <text class="h3" x="44" y="0">Where modules start</text>
    <text class="body" x="0" y="26">Built-in modules and catalog agents</text>
    <text class="body" x="0" y="45">begin as advisors and earn their way up.</text>
  </g>
  <g transform="translate(624 274)">
    <text class="num" x="0" y="0" font-size="13" fill="#f17070">0.50</text>
    <text class="h3" x="44" y="0">Grants collapse below it</text>
    <text class="body" x="0" y="26">Aegis deletes every grant the agent held,</text>
    <text class="body" x="0" y="45">however its score fell, and the shell</text>
    <text class="body" x="0" y="64">switches to the alert mood.</text>
  </g>
  <g transform="translate(908 274)">
    <text class="num" x="0" y="0" font-size="13" fill="#76cf8a">0.75</text>
    <text class="h3" x="44" y="0">Notable calls go through</text>
    <text class="body" x="0" y="26">Notable capabilities stop prompting.</text>
    <text class="body" x="0" y="45">Sensitive ones still ask you, and</text>
    <text class="body" x="0" y="64">privileged ones never auto-grant.</text>
  </g>
</svg>
