<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>ONEXUS</title>
  <link rel="stylesheet" href="/aurora/static/tokens.css">
  <link rel="stylesheet" href="/aurora/static/mood.css">
  <link rel="stylesheet" href="/aurora/static/components.css">
  <link rel="stylesheet" href="/aurora/static/scene.css">
  <link rel="stylesheet" href="/aurora/static/app.css">
</head>
<body class="nx-mood nx-mood-calm-focus" data-mood="calm_focus">
  <!-- Ambient light: a faint horizon in the current mood's accent -->
  <div class="nx-ambient" aria-hidden="true"></div>

  <!-- Shell: row 1 is the chrome bar, row 2 the body grid -->
  <div class="nx-shell" id="nx-shell">

    <!-- Chrome bar. Window controls belong to the browser or the native
         Tauri shell, so they are not drawn here. -->
    <header class="nx-chrome">
      <div class="nx-chrome-left">
        <button class="nx-icon-btn nx-chrome-menu" id="nx-side-toggle" type="button" title="Show the sidebar" aria-label="Toggle sidebar" aria-controls="nx-sidebar" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <button class="nx-chrome-home" id="nx-chrome-home" type="button" title="Return to workspace home">
          <span class="nx-chrome-mark" id="nx-kernel-mark"></span>
          <span class="nx-chrome-brand">ONEXUS</span>
        </button>
        <span class="nx-chrome-sep" aria-hidden="true">/</span>
        <button class="nx-chrome-context" id="nx-chrome-context" type="button">no workspace</button>
      </div>

      <div class="nx-chrome-right">
        <button class="nx-icon-btn nx-chrome-icon" id="nx-tl-focus" type="button" title="Focus mode: hide the sidebar and rail (Esc to exit)" aria-label="Toggle focus mode">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/></svg>
        </button>
        <button class="nx-icon-btn nx-chrome-icon" id="nx-tl-fullscreen" type="button" title="Toggle fullscreen" aria-label="Toggle fullscreen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/></svg>
        </button>
        <button class="nx-icon-btn nx-chrome-icon" id="nx-open-tour" type="button" title="Replay the welcome tour" aria-label="Replay the welcome tour">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="m16.24 7.76-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/></svg>
        </button>
        <button class="nx-icon-btn nx-chrome-icon" id="nx-open-guide" type="button" title="Open the guide (?)" aria-label="Open the guide">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><path d="M12 17h.01"/></svg>
        </button>
        <button class="nx-icon-btn nx-chrome-icon" id="nx-cockpit-toggle" type="button" title="Show or hide the cockpit rail" aria-label="Toggle the cockpit rail">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/></svg>
        </button>
        <span class="nx-chrome-divider" aria-hidden="true"></span>
        <button class="nx-mood-pill" id="nx-mood-pill" type="button" title="Ambient mood (Cmd+0 opens the expanded cockpit)">
          <span class="nx-mood-dot" aria-hidden="true"></span>
          <span class="nx-mood-label" id="nx-mood-label">calm focus</span>
        </button>
        <span class="nx-chrome-clock nx-mono" id="nx-clock">--:--</span>
      </div>
    </header>

    <!-- Body grid: sidebar, main canvas, cockpit rail -->
    <div class="nx-body" id="nx-body">

      <aside class="nx-region nx-sidebar" id="nx-sidebar" aria-label="Navigation">
        <div class="nx-region-inner nx-sidebar-inner">
          <div class="nx-search">
            <svg class="nx-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m21 21-4.35-4.35"/></svg>
            <input class="nx-search-input" id="nx-search-input"
                   placeholder="Search the catalog"
                   aria-label="Search the agent catalog">
            <span class="nx-kbd" aria-hidden="true">/</span>
          </div>

          <nav class="nx-section nx-nav" aria-label="Tools">
            <button class="nx-side-link" id="nx-open-cortex" type="button">
              <svg class="nx-side-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="6" height="6" x="3" y="15" rx="1"/><rect width="6" height="6" x="15" y="15" rx="1"/><rect width="6" height="6" x="9" y="3" rx="1"/><path d="M6 15v-2a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v2"/><path d="M12 12V9"/></svg>
              <span>Cortex launch</span>
              <span class="nx-side-link-kbd">⌘L</span>
            </button>
            <button class="nx-side-link" id="nx-open-watch" type="button">
              <svg class="nx-side-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg>
              <span>Kernel watch</span>
              <span class="nx-side-link-kbd">⌘J</span>
            </button>
            <button class="nx-side-link" id="nx-open-memory" type="button">
              <svg class="nx-side-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>
              <span>Memory replay</span>
              <span class="nx-side-link-kbd">⌘Y</span>
            </button>
            <button class="nx-side-link" id="nx-open-workshop" type="button">
              <svg class="nx-side-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
              <span>Workshop</span>
              <span class="nx-side-link-kbd">⌘E</span>
            </button>
            <button class="nx-side-link" id="nx-open-search" type="button">
              <svg class="nx-side-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
              <span>Web search</span>
              <span class="nx-side-link-kbd">⌘/</span>
            </button>
            <button class="nx-side-link" id="nx-open-store" type="button">
              <svg class="nx-side-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
              <span>Agent store</span>
              <span class="nx-side-link-kbd"></span>
            </button>
            <button class="nx-side-link" id="nx-open-catalog" type="button">
              <svg class="nx-side-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
              <span>Agent catalog</span>
              <span class="nx-side-link-kbd"></span>
            </button>
          </nav>

          <div class="nx-section">
            <div class="nx-section-head">
              <div class="nx-section-label">Workspaces</div>
              <span class="nx-kbd" title="New workspace" aria-hidden="true">⌘N</span>
            </div>
            <div class="nx-ws-list" id="nx-ws-list"></div>
            <button class="nx-new-ws" id="nx-new-ws" type="button" title="New workspace (⌘N)">
              <svg class="nx-new-ws-plus" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
              <span class="nx-new-ws-label">New workspace</span>
            </button>
          </div>

          <div class="nx-section">
            <div class="nx-section-head">
              <div class="nx-section-label">Recent agents</div>
            </div>
            <div class="nx-agent-list" id="nx-recent-agents"></div>
          </div>
        </div>

        <!-- Footer: a sibling of the scroll area so it stays pinned -->
        <div class="nx-side-foot">
          <button class="nx-side-link" id="nx-open-settings" type="button">
            <svg class="nx-side-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
            <span>Settings</span>
            <span class="nx-side-link-kbd">⌘P</span>
          </button>
          <div class="nx-user-footer" id="nx-user-footer">
            <div class="nx-user-avatar nx-avatar"><span id="nx-user-initials">CE</span></div>
            <div class="nx-user-meta">
              <div class="nx-user-name" id="nx-user-name">you</div>
              <div class="nx-user-sub">Local and sovereign</div>
            </div>
          </div>
        </div>
      </aside>

      <!-- Main canvas: rendered by JS per route -->
      <main class="nx-region nx-main" id="nx-main"></main>

      <!-- Cockpit rail -->
      <aside class="nx-region nx-cockpit-rail" id="nx-cockpit-rail" aria-label="Cockpit">
        <div class="nx-region-inner nx-cockpit-inner">
          <section class="nx-cp-section">
            <div class="nx-section-head"><div class="nx-section-label">Trust, last 60 min</div></div>
            <div class="nx-trust-card" id="nx-trust-card"></div>
          </section>

          <section class="nx-cp-section">
            <div class="nx-section-head"><div class="nx-section-label">Recent permissions</div></div>
            <div class="nx-perm-log" id="nx-perm-log"></div>
          </section>

          <section class="nx-cp-section">
            <div class="nx-section-head">
              <div class="nx-section-label">KERNEL, LIVE</div>
              <button class="nx-cp-watch-link nx-link" id="nx-open-watch-rail" type="button" title="Open the full Watch scene (⌘J)">Watch</button>
            </div>
            <div class="nx-rail-scene" id="nx-rail-scene"><canvas id="nx-rail-scene-canvas"></canvas></div>
            <div class="nx-kernel-viz" id="nx-kernel-viz"></div>
          </section>

          <section class="nx-cp-section">
            <div class="nx-section-head"><div class="nx-section-label">MORNING BRIEF</div></div>
            <div class="nx-morning-brief" id="nx-morning-brief"></div>
          </section>

          <section class="nx-cp-section">
            <div class="nx-section-head"><div class="nx-section-label">Negotiations</div></div>
            <div class="nx-herald-panel" id="nx-herald-panel"></div>
          </section>

          <section class="nx-cp-section">
            <div class="nx-section-head"><div class="nx-section-label">Federation sync</div></div>
            <div class="nx-fedsync-panel" id="nx-fedsync-panel"></div>
          </section>

          <section class="nx-cp-section">
            <div class="nx-section-head"><div class="nx-section-label">Ambient mood</div></div>
            <div class="nx-mood-card" id="nx-mood-card"></div>
            <div class="nx-mood-reasons" id="nx-mood-reasons"></div>
          </section>

          <section class="nx-cp-section">
            <div class="nx-section-head"><div class="nx-section-label" id="nx-agents-label">10 built-in, 7K+ in the catalog</div></div>
            <div class="nx-agent-discs" id="nx-agent-discs"></div>
          </section>
        </div>

        <!-- Footer: a sibling of the scroll area so it stays pinned -->
        <div class="nx-cp-foot nx-mono">
          <div>v1.0</div>
          <div>kernel.network.io = ∅ <span class="nx-cp-foot-sub">(static-verified)</span></div>
        </div>
      </aside>

    </div><!-- /nx-body -->
  </div><!-- /nx-shell -->

  <!-- Overlay root: switcher, new workspace, cockpit, tour, capability sheet, guide -->
  <div id="nx-overlay-root"></div>

  <script type="module" src="/aurora/static/app.js"></script>
</body>
</html>
